name: Deterministic QA

on:
  push:
    branches:
      - feat/quality-judge-holdout
  pull_request:

permissions:
  contents: read

concurrency:
  group: deterministic-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-qa:
    name: Rules and typecheck
    runs-on: [self-hosted, macOS, ARM64, pari-qa]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic paraphrase QA
        run: npm run qa:paraphrase

      - name: TypeScript typecheck
        run: npx tsc -p tsconfig.json --noEmit
