name: Deterministic QA

on:
  push:
    branches:
      - main
      - feat/quality-judge-holdout
  pull_request:

permissions:
  contents: read

concurrency:
  group: deterministic-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The deterministic suites are the committed quality floor and are expected to
# stay green. Known engine limitations (formerly tracked in app/docs/remaining-work.md,
# now on the archive/2026-10 branch)
# (P1.3 entailment/contradiction gate, note-fragment repair) are reported by
# separate scripts and must not be masked by loosening these assertions.
jobs:
  deterministic-qa:
    name: Rules and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic paraphrase QA
        run: npm run qa:paraphrase

      - name: TypeScript typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Word Studio Python tests
        working-directory: bench/word-studio
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -p 'test_*.py'
